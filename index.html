<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boots Shop Slideshow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="heading">let's see the preview!!!</h1>

  <div class="card">
    <div class="card-content">
      <h2 class="shop-title">Boots Shop</h2>
      <p class="subtitle">SEASON BOOTS</p>
      <div class="discount">50% OFF</div>

      <div class="boot-container">
      <img id="bootImage" src="images/boot1.png" alt="boot" class="boot-img">
    </div>
  </div>
  </div>

  <div class="dots">
    <button class="dot active" data-index="0">1</button>
    <button class="dot" data-index="1">2</button>
    <button class="dot" data-index="2">3</button>
    <button class="dot" data-index="3">4</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
